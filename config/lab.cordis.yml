# DSH SUPREME — LAB composition (Spec §16): full suite + LAB-only overrides.
# Structurally distinct from production: LAB executionClass, LAB-only paid
# override, test-only synthetic adapter, command-capable verifier, gate driver.
- insert:
    - id: supreme-policy
      name: "__SUPREME_DIST__/supreme-policy/index.mjs"
      config:
        executionClass: LAB
        allowPaid: true

    - id: supreme-observability
      name: "__SUPREME_DIST__/supreme-observability/index.mjs"
      config:
        dataDir: "__PROJECT_ROOT__/dsh-supreme/data/observability"

    - id: supreme-benchmark
      name: "__SUPREME_DIST__/supreme-benchmark/index.mjs"
      config:
        dataDir: "__PROJECT_ROOT__/dsh-supreme/data/benchmark"

    - id: supreme-fake-llm
      name: "__SUPREME_DIST__/supreme-fake-llm/index.mjs"
      config:
        provider: synthetic-free

    - id: supreme-router
      name: "__SUPREME_DIST__/supreme-router/index.mjs"
      config:
        candidates:
          - provider: synthetic-free
            credentialMode: config-owned
            credentialConfigured: true
            quotaHeadroom: 0.95
            models:
              - model: synthetic-mini
                costClass: FREE_CONFIRMED
                capabilities: [chat]
                contextWindow: 32768
                failureDomain: synthetic
          - provider: synthetic-paid
            credentialMode: config-owned
            credentialConfigured: true
            quotaHeadroom: 0.9
            models:
              - model: synthetic-paid-large
                costClass: PAID
                capabilities: [chat]
                contextWindow: 131072
                failureDomain: synthetic-paid

    - id: supreme-verifier
      name: "__SUPREME_DIST__/supreme-verifier/index.mjs"
      config:
        allowCommands: true
        allowedRoots:
          - "__PROJECT_ROOT__/dsh-supreme/data"

    - id: supreme-memory-policy
      name: "__SUPREME_DIST__/supreme-memory-policy/index.mjs"
      config:
        registerPromptSection: false
        projectKnowledge:
          - id: lab-overview
            text: "LAB composition: verbose diagnostics and synthetic fixtures are permitted here only."
            priority: 70

    - id: supreme-workflow-policy
      name: "__SUPREME_DIST__/supreme-workflow-policy/index.mjs"
      config:
        maxConcurrentAgents: 4

    - id: supreme-gate-driver
      name: "__SUPREME_DIST__/supreme-gate-driver/index.mjs"
      config:
        markerPath: "__PROJECT_ROOT__/dsh-supreme/data/real/gates-lab.markers.jsonl"
