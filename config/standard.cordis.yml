# DSH SUPREME — STANDARD composition (Spec §16):
# policy + observability + memory-policy + verifier. No router/benchmark.
- insert:
    - id: supreme-minimal-probe
      name: "__SUPREME_DIST__/supreme-minimal-probe/index.mjs"
      config:
        markerPath: "__SUPREME_DATA__/real/minimal-probe.markers.jsonl"

    - id: supreme-boot-probe
      name: "__SUPREME_DIST__/supreme-boot-probe/index.mjs"
      config:
        markerPath: "__SUPREME_DATA__/real/boot-probe-standard.markers.jsonl"

    - id: supreme-policy
      name: "__SUPREME_DIST__/supreme-policy/index.mjs"
      config:
        executionClass: STANDARD

    - id: supreme-observability
      name: "__SUPREME_DIST__/supreme-observability/index.mjs"
      config:
        dataDir: "__SUPREME_DATA__/observability"

    - id: supreme-memory-policy
      name: "__SUPREME_DIST__/supreme-memory-policy/index.mjs"
      config:
        registerPromptSection: false
        projectKnowledge:
          - id: project-overview
            text: "DSH Supreme v1: seven host-side policy plugins composed on DeepSeek Harness."
            priority: 60

    - id: supreme-verifier
      name: "__SUPREME_DIST__/supreme-verifier/index.mjs"
      config:
        allowedRoots:
          - "__SUPREME_DATA__"
